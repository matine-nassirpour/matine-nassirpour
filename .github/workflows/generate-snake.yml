name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OUTPUT_DIR="${RUNNER_TEMP}/snake-output"

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add --detach "$OUTPUT_DIR" origin/output
          else
            git worktree add --detach "$OUTPUT_DIR"
            cd "$OUTPUT_DIR"
            git checkout --orphan output
            cd "$GITHUB_WORKSPACE"
          fi

          cd "$OUTPUT_DIR"

          # Nettoie le contenu de la branche output sans supprimer
          # les données internes du worktree.
          git rm -rf . 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/dist/github-contribution-grid-snake.svg" .
          cp "$GITHUB_WORKSPACE/dist/github-contribution-grid-snake-dark.svg" .
          touch .nojekyll

          git add .

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update contribution snake"
          git push origin HEAD:output
